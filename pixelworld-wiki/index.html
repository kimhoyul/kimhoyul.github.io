<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelWorld Wiki</title></head>
<body><p id="loading">PixelWorld 위키를 불러오는 중입니다.</p><noscript>문서를 표시하려면 JavaScript가 필요합니다.</noscript>
<script src="engine-transition.js?v=20261017-2"></script>
<script>
(async function(){
  try {
    const response=await fetch('wiki-shell.html',{cache:'no-store'});
    if(!response.ok)throw new Error('위키 파일 응답 '+response.status);
    const source=await response.text();
    const pattern=/(<script id="seed-data" type="application\/json">)([\s\S]*?)(<\/script>)/;
    const matched=source.match(pattern);
    if(!matched)throw new Error('문서 데이터를 찾지 못했습니다.');
    const original=JSON.parse(matched[2]);
    const published=window.applyPixelWorldEngineTransition(structuredClone(original),original);
    try {
      const key='pixelworld-wiki-data-v1',raw=localStorage.getItem(key);
      if(raw){
        const saved=JSON.parse(raw);
        if(Array.isArray(saved.pages)){
          if(saved.engineTransitionVersion!==2)localStorage.setItem(key+'-before-guided-20261017',raw);
          localStorage.setItem(key,JSON.stringify(window.applyPixelWorldEngineTransition(saved,original)));
        }
      }
    } catch(storageError){console.warn('브라우저 저장 데이터는 변경하지 못했습니다.',storageError);}
    const json=JSON.stringify(published,null,2).replace(/</g,'\\u003c');
    const output=source.replace(pattern,(_,start,data,end)=>start+json+end);
    document.open();document.write(output);document.close();
  } catch(error){
    const message=document.getElementById('loading');
    message.textContent='위키를 불러오지 못했습니다. 새로고침해 주세요. '+error.message;
    const retry=document.createElement('button');retry.textContent='다시 시도';retry.onclick=()=>location.reload();document.body.appendChild(retry);
  }
})();
</script></body></html>
